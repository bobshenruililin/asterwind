<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Leadership, unfolded</title>
<!-- A playable journey through the word "Leadership". Original cut-paper art drawn in code (to be replaced, one
     layer at a time, by commissioned art: see ART-BRIEF.md). Fictional characters and lines; proposals, not
     approved story. No network, storage or account needed. Serve over HTTP or open directly. -->
<style>
@font-face{font-family:Kalam;src:url('../../../app/assets/fonts/Kalam-Regular.ttf') format('truetype');font-display:swap}
:root{--ink:#f4ead6;--gold:#e9c27a;--dim:#b7ab98;--night:#141629;--paper:#efe3c8;--pencil:#4a4652;--hand:Kalam,'Segoe Print','Comic Sans MS',cursive}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b12;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:var(--night)}
#frame.portrait{width:min(100vw,46.15vh);aspect-ratio:900/1950}
#story .box{position:absolute;inset:0}
#frame.portrait #story .box{inset:auto;left:0;right:0;top:20%;aspect-ratio:16/9}
#frame.portrait #caption{bottom:auto;top:47%;width:90%;font-size:17px}
#frame.portrait .choice{width:16%}#frame.portrait .choice span{font-size:13px;white-space:normal;width:9em;text-align:center}
#frame.portrait #story{background:#0d0e1a}
.screen{position:absolute;inset:0}
.screen svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Notebook */
#tiles{position:absolute;display:flex;flex-wrap:nowrap;justify-content:center;gap:.6%}
.tile{flex:0 0 9.3%;aspect-ratio:3/4;border:0;border-radius:3px;background:#f6ecd5;color:#2b2731;font:400 clamp(16px,3vw,44px)/1 Georgia,serif;box-shadow:0 3px 0 #cdbb98,0 6px 10px #0005;transition:transform .25s steps(3),opacity .2s steps(2),background .2s;position:relative}
.tile:hover{transform:translateY(-4%)}
.tile[aria-pressed=true]{transform:translateY(-28%) rotate(var(--r,-3deg));background:#fff6df;box-shadow:0 3px 0 #cdbb98,0 14px 16px #0006}
.tile.glow{box-shadow:0 0 0 3px #e9c27a88,0 3px 0 #cdbb98,0 6px 10px #0005}
.tile.used{opacity:.35}
#spell{position:absolute;text-align:center;font:clamp(18px,2.6vw,38px) var(--hand);color:#3d3a48;letter-spacing:.18em;min-height:1.4em}
#spell.wrong{animation:shake .45s steps(6)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#note{position:absolute;text-align:center;font:clamp(13px,1.7vw,24px)/1.35 var(--hand);color:#5b5566;min-height:2.6em}
.boat{position:absolute;width:6.4%;aspect-ratio:1;border:0;background:none;padding:0;transform:translate(-50%,-50%)}
.boat span{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:clamp(12px,1.6vw,22px) var(--hand);color:#3d3a48;white-space:nowrap}
.boat svg{width:100%;height:100%}
.boat:hover svg,.boat:focus-visible svg{transform:translateY(-6%) rotate(-4deg)}
.boat.done span{text-decoration:line-through 1px #3d3a4866}
#go{position:absolute;transform:translate(-50%,-50%);font:clamp(13px,1.6vw,22px) var(--hand);background:#f6ecd5;color:#2b2731;border:0;border-radius:3px;padding:.5em 1em;box-shadow:0 3px 0 #cdbb98,0 6px 10px #0005}
/* Story */
#caption{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(820px,84%);margin:0;text-align:center;font-size:clamp(15px,2.1vw,28px);line-height:1.35;text-shadow:0 2px 8px #000,0 0 2px #000;pointer-events:none}
#who{display:block;font:10px system-ui;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.choice{position:absolute;border:0;background:none;padding:0;border-radius:50%;width:9%;aspect-ratio:1;transform:translate(-50%,-50%)}
.choice::before{content:'';position:absolute;inset:28%;border:2px solid #f6dfae;border-radius:50%;box-shadow:0 0 18px #f6c76e88;transition:transform .2s steps(2)}
.choice:hover::before,.choice:focus-visible::before{transform:scale(1.3);background:#f6c76e33}
.choice span{position:absolute;left:50%;top:84%;transform:translateX(-50%);white-space:nowrap;font:clamp(14px,1.9vw,25px) Georgia,serif;text-shadow:0 2px 6px #000,0 0 2px #000}
#reveal{position:absolute;inset:0;pointer-events:none}
/* Mirror */
#mirror{background:radial-gradient(120% 90% at 30% 20%,#191a24,#07070b 60%)}
#mirror .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff0c 45%,transparent 60%)}
#mirror .q{position:absolute;left:12%;right:12%;top:50%;transform:translateY(-50%);text-align:center;font-size:clamp(18px,2.8vw,40px);line-height:1.35;color:#e8dcc4}
#mirror .trace{position:absolute;inset:auto;left:50%;top:9%;width:9%;height:auto;aspect-ratio:1;transform:translateX(-50%);opacity:.38}
#mirror .mbtns button,#end button{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:none;border:1px solid #e9c27a88;border-radius:2px;padding:.6em 1.4em;font:clamp(13px,1.5vw,18px) system-ui;color:var(--ink)}
/* Ending */
#mine{position:absolute;background:transparent;border:0;border-bottom:1px solid #4a465266;font:clamp(16px,2.4vw,34px) var(--hand);color:#2b2731;text-align:center}
#mine::placeholder{color:#8b8494}
#closebook{position:absolute;transform:translate(-50%,-50%);font:clamp(13px,1.6vw,22px) var(--hand);background:#f6ecd5;color:#2b2731;border:0;border-radius:3px;padding:.45em 1em;box-shadow:0 3px 0 #cdbb98}
#end{background:#050507}
#end .q{position:absolute;left:10%;right:10%;top:42%;transform:translateY(-50%);text-align:center;font-size:clamp(20px,3.4vw,48px);color:#e8dcc4;line-height:1.3}
#end .small{display:block;font:clamp(12px,1.3vw,16px)/1.6 system-ui;color:#8d8578;margin-top:1.2em}
/* Chrome */
#chrome{position:absolute;right:1.2%;top:1.6%;display:flex;gap:6px;z-index:9;opacity:.55}
#chrome:hover,#chrome:focus-within{opacity:1}
#chrome button{background:#0b0b12aa;border:1px solid #ffffff22;border-radius:16px;min-width:40px;height:34px;padding:0 10px;font:12px system-ui}
#chrome button[aria-pressed=true]{color:var(--gold);border-color:#e9c27a88}
/* Corridor and dispenser */
#corridor{background:#0d0e1a}
#corridor .slot{position:absolute;border:0;background:none;padding:0;border-radius:6px}
#corridor .slot:hover,#corridor .slot:focus-visible{background:#ffe2a01a}
.cbtn{position:absolute;background:#0b0b12cc;border:1px solid #e9c27a88;border-radius:2px;padding:.55em 1.2em;font:clamp(13px,1.5vw,18px) system-ui;color:var(--ink)}
#nb-open{left:3%;bottom:5%}#morning{right:3%;bottom:5%}
#c-cap{position:absolute;left:50%;bottom:4.2%;transform:translateX(-50%);width:min(620px,52%);margin:0;text-align:center;font:clamp(14px,1.8vw,24px)/1.35 Georgia,serif;text-shadow:0 2px 8px #000;pointer-events:none}
/* A bottle in the hand */
#held{background:radial-gradient(70% 90% at 50% 40%,#2a2238,#0a0a12 70%)}
#held .lift{transition:transform .7s steps(6)}#held.up .lift{transform:translateY(-7%) scale(1.04)}
#held .hbtns{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#held .hbtns button{background:#0b0b12cc;border:1px solid #ffffff33;border-radius:2px;padding:.55em 1.1em;font:clamp(13px,1.5vw,18px) system-ui;color:var(--ink);min-height:40px}
#held .hbtns #hold-up{border-color:#e9c27a;color:#ffe2a0}
#frame.portrait #held .hbtns{bottom:2%}
#frame.portrait #c-cap{bottom:11%;width:88%}#frame.portrait .cbtn{bottom:3%}
/* The crossing and the film */
.crossing{z-index:5}
#filmscr{background:#050507;z-index:4}#filmscr.crossing{background:none}
#filmscr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050507}
#slate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#efe3c8 url('../../../hub/art/textures/paper-grain.webp');background-size:512px;color:#2b2731;text-align:center;z-index:2;padding:0 10%}
#slate b{font:400 clamp(22px,3.4vw,48px) Georgia,serif}#slate span{font:clamp(15px,2vw,26px)/1.4 var(--hand);color:#5b5566;margin-top:.8em}
#film-leave{position:absolute;left:1.2%;top:1.6%;z-index:3;background:#0b0b12aa;border:1px solid #ffffff22;border-radius:16px;height:34px;padding:0 12px;font:12px system-ui;color:var(--ink);opacity:.6}
#film-leave:hover,#film-leave:focus-visible{opacity:1}
#film-back{position:absolute;right:2.5%;bottom:4%;z-index:3;background:#0b0b12dd;border:1px solid #e9c27a;border-radius:2px;padding:.6em 1.4em;font:clamp(13px,1.5vw,18px) system-ui;color:#ffe2a0}
/* Optional looks: a thought, an object, and the way you didn't take */
.peek{position:absolute;border:0;background:none;padding:0;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;border-radius:50%}
.peek::before{content:'';position:absolute;inset:30%;border:1.5px dashed #efe3c8aa;border-radius:50%}
.peek:hover::before,.peek:focus-visible::before{border-style:solid;background:#efe3c822}
.peek span{position:absolute;left:50%;bottom:86%;transform:translateX(-50%);white-space:nowrap;font:clamp(12px,1.5vw,19px) var(--hand);color:#efe3c8cc;text-shadow:0 2px 6px #000}
#frame.portrait #thought{top:auto;bottom:104%;left:50%;width:92%}
#thought{position:absolute;left:19%;top:22%;transform:translateX(-50%);width:30%;margin:0;text-align:center;font:clamp(15px,2vw,27px)/1.35 var(--hand);color:#f3e7cc;text-shadow:0 2px 8px #000;pointer-events:none}
#story.ghost .box{filter:grayscale(1) sepia(.25) contrast(.85) brightness(1.15)}
#story.ghost #caption{font-style:italic;color:#d9cfbd}
#ghost-slate{position:absolute;left:50%;top:3%;transform:translateX(-50%);margin:0;font:12px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#d9cfbd;white-space:nowrap}
#mirror .mem{position:absolute;left:14%;right:14%;top:31%;text-align:center;font:clamp(14px,1.8vw,24px)/1.4 var(--hand);color:#b9ad98}
#mirror .mbtns{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#mirror .mbtns button{position:static;transform:none}
#mirror .mbtns #mirror-other{border-color:#ffffff33;color:#b7ab98}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-aspect-ratio:1/1){#frame{width:100vw}#caption{font-size:15px;bottom:3%}}
</style>
</head>
<body>
<div id="app"><div id="frame">
 <section class="screen" id="notebook" aria-label="A notebook. The word Leadership is written on the left page.">
  <svg viewBox="0 0 1600 900" aria-hidden="true" focusable="false" id="nb-svg"></svg>
  <div id="tiles" role="group" aria-label="The letters of Leadership. Choose letters to spell a word hidden inside it, or type."></div>
  <div id="spell" aria-live="polite"></div>
  <div id="note" aria-live="polite"></div>
  <div id="boats"></div>
  <button id="go" hidden>Close the notebook</button>
  <input id="mine" hidden maxlength="24" aria-label="Leadership is… (optional; stays on this screen only)" placeholder="your word">
  <button id="closebook" hidden>Done</button>
 </section>
 <section class="screen" id="corridor" hidden aria-label="A corridor at night. A drinks dispenser glows in the corner.">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" id="co-svg"></svg>
  <div id="slots" role="group" aria-label="Bottles in the dispenser"></div>
  <p id="c-cap" aria-live="polite"></p>
  <button class="cbtn" id="nb-open">Open the notebook</button><button class="cbtn" id="morning" hidden>Wait for morning</button>
 </section>
 <section class="screen" id="held" hidden aria-label="A bottle in your hand">
  <svg viewBox="0 0 1600 900" aria-hidden="true" focusable="false" id="hb-svg"></svg>
  <p class="sr" id="label-text" aria-live="polite"></p>
  <div class="hbtns"><button id="turn-l" aria-label="Turn the bottle left">‹ Turn</button><button id="hold-up">Hold it up to the light</button><button id="turn-r" aria-label="Turn the bottle right">Turn ›</button><button id="put-back">Put it back</button></div>
 </section>
 <section class="screen" id="filmscr" hidden aria-label="">
  <div id="slate" hidden><b></b><span></span></div>
  <button id="film-leave">Back into the night</button><button id="film-back" hidden>Back into the night</button>
 </section>
 <section class="screen" id="story" hidden aria-label="">
  <p id="ghost-slate" hidden>Another way · it doesn’t change what you did</p>
  <div class="box"><svg viewBox="0 0 1600 900" aria-hidden="true" focusable="false" id="st-svg"></svg>
  <svg id="reveal" viewBox="0 0 1600 900" aria-hidden="true" focusable="false"><defs><radialGradient id="rv" r=".5"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><mask id="rvm" maskUnits="userSpaceOnUse"><rect width="1600" height="900" fill="#fff"/><circle id="rvc" cx="800" cy="450" r="260" fill="url(#rv)"/></mask></defs><rect id="rvr" width="1600" height="900" fill="#05050a" mask="url(#rvm)" opacity="0"/></svg>
  <div id="choices"></div><p id="thought" aria-hidden="true"></p></div>
  <p id="caption" aria-hidden="true"><span id="who"></span><span id="line"></span></p>
  <p class="sr" id="desc"></p>
 </section>
 <section class="screen" id="mirror" hidden aria-live="polite"><div class="sheen"></div><svg class="trace" viewBox="0 0 200 200" aria-hidden="true" focusable="false"></svg><p class="mem"></p><p class="q"></p><div class="mbtns"><button id="mirror-go">Continue</button><button id="mirror-other" hidden>See the other way</button></div></section>
 <section class="screen" id="end" hidden><p class="q">You are in this one too.<span class="small">Every room asked the same question a different way. Nothing was scored, and nothing you wrote was kept.</span></p><button id="again">Begin again</button></section>
 <div id="chrome"><button id="snd" aria-pressed="false" aria-label="Sound">♪</button><button id="voice" hidden aria-label="Voices">Voices: off</button><button id="pause" aria-pressed="false" hidden>Pause</button></div>
</div></div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
'use strict';
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),EXPORT=Q.has('export');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,FPS=12;
const GRAIN='../../../hub/art/textures/paper-grain.webp';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
// ---------- the paper kit: every edge is cut by hand ----------
let SEED=3;
function cutd(pts,amp=1.4,step=18){const r=rng(SEED+=11),o=[];for(let i=0;i<pts.length;i++){const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%pts.length],n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/step));for(let k=0;k<n;k++){const u=k/n;o.push([x0+(x1-x0)*u+(k?(r()-.5)*2*amp:0),y0+(y1-y0)*u+(k?(r()-.5)*2*amp:0)])}}return'M'+o.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z'}
const EDGE='stroke="#fff6e4" stroke-opacity=".2" stroke-width="1.5" stroke-linejoin="round"';
const P=(pts,fill,extra='')=>`<path d="${cutd(pts)}" fill="${fill}" ${extra}/>`;
const ell=(cx,cy,rx,ry,n=28)=>[...Array(n)].map((_,i)=>[cx+rx*Math.cos(i/n*6.283),cy+ry*Math.sin(i/n*6.283)]);
const DEFS=`<defs>
 <pattern id="grain" width="512" height="512" patternUnits="userSpaceOnUse"><image href="${GRAIN}" width="512" height="512"/></pattern>
 <filter id="lift" x="-15%" y="-15%" width="140%" height="140%"><feDropShadow dx="5" dy="7" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <radialGradient id="warm" r=".5"><stop offset="0" stop-color="#ffd890" stop-opacity=".95"/><stop offset=".4" stop-color="#f4a94e" stop-opacity=".45"/><stop offset="1" stop-color="#f4a94e" stop-opacity="0"/></radialGradient>
 <radialGradient id="green" r=".5"><stop offset="0" stop-color="#eaf2a8" stop-opacity=".95"/><stop offset=".45" stop-color="#9bc27a" stop-opacity=".5"/><stop offset="1" stop-color="#9bc27a" stop-opacity="0"/></radialGradient>
 <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1124"/><stop offset="1" stop-color="#2a2f55"/></linearGradient>
 <linearGradient id="dawnsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c3d8"/><stop offset=".7" stop-color="#f1d6b3"/><stop offset="1" stop-color="#f6e2c2"/></linearGradient>
</defs>`;
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">${DEFS}<defs><filter id="nb-lift"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".4"/></filter></defs></svg>`);
const GRAINRECT=o=>`<rect width="1600" height="900" fill="url(#grain)" opacity="${o}" pointer-events="none"/>`;
// A person, cut from card and seen in profile; each part turns about its own pin.
function person(id,o){const s=o.s||1,f=o.flip?-1:1,c=o.coat,c2=o.coat2||c,sk=o.skin||'#d6a27a',h=o.hair||'#2a2230',e=EDGE;
 const hair={bun:P([[-28,-206],[-22,-238],[4,-250],[30,-240],[34,-222],[16,-228],[0,-224],[-6,-200],[-16,-180],[-30,-186]],h,e)+P(ell(-26,-238,16,15,14),h,e),
  short:P([[-28,-202],[-24,-236],[-4,-252],[22,-250],[38,-236],[36,-220],[20,-228],[2,-224],[-8,-206],[-14,-188],[-28,-190]],h,e),
  long:P([[-30,-200],[-24,-238],[-2,-252],[24,-248],[38,-232],[34,-220],[18,-228],[0,-222],[-8,-196],[-6,-150],[-34,-146],[-36,-176]],h,e),
  grey:P([[-28,-206],[-22,-238],[4,-250],[30,-240],[34,-222],[16,-228],[0,-224],[-6,-200],[-16,-180],[-30,-186]],'#c9c3bd',e)+P(ell(-28,-232,15,14,14),'#c9c3bd',e),
  wild:P([[-30,-196],[-36,-228],[-20,-240],[-14,-258],[2,-248],[12,-262],[22,-246],[40,-248],[36,-226],[24,-228],[6,-222],[-6,-200],[-16,-182],[-30,-184]],h,e),
  wavy:P([[-30,-198],[-32,-226],[-22,-244],[-6,-256],[8,-250],[20,-258],[34,-248],[42,-234],[36,-224],[26,-230],[14,-224],[2,-228],[-6,-212],[-10,-196],[-18,-182],[-30,-186]],h,e)}[o.hairStyle||'short'];
 const specs=o.glasses?'<circle cx="31" cy="-212" r="8.5" fill="#efe3c8" fill-opacity=".12" stroke="#1d1a22" stroke-width="2.6"/><path d="M22.5 -213 L-8 -210" stroke="#1d1a22" stroke-width="2.2"/>':'';
 const legs=o.standing?P([[-30,-2],[24,-2],[28,150],[10,150],[0,44],[-10,150],[-30,150]],c2,e)+P([[-34,146],[-6,146],[-4,158],[-38,158]],'#1d1a22')+P([[6,146],[34,146],[36,158],[4,158]],'#1d1a22'):P([[-34,-6],[98,-12],[102,14],[94,96],[74,96],[72,18],[-34,20]],c2,e);
 return `<g id="${id}" transform="translate(${o.x} ${o.y}) scale(${f*s} ${s})"><g class="pp" data-part="body" data-pivot="0 0">${legs}
  ${P([[-46,-150],[24,-160],[50,-72],[44,0],[-50,2]],c,e)}${P([[-44,-150],[-6,-156],[-14,-60],[-48,-40]],c2,'opacity=".55"')}
  <g class="pp" data-part="head" data-pivot="6 -176">${P([[-4,-180],[14,-180],[16,-150],[-6,-150]],sk)}
   ${P([[-24,-212],[-16,-236],[8,-244],[30,-234],[36,-214],[46,-202],[36,-196],[38,-188],[32,-184],[30,-172],[12,-164],[-8,-168],[-22,-184]],sk,e)}
   <path d="M24 -214 q5 -2 8 1" stroke="#2a2230" stroke-width="2.6" fill="none" stroke-linecap="round"/>${hair}${specs}</g>
  <g class="pp" data-part="arm" data-pivot="16 -140">${P([[2,-150],[30,-146],[50,-84],[26,-74]],c,e)}
   <g class="pp" data-part="fore" data-pivot="38 -80">${P([[24,-90],[48,-82],[104,-72],[100,-54],[28,-62]],c,e)}
    <g class="pp" data-part="hand" data-pivot="100 -62">${P([[96,-76],[124,-74],[134,-62],[126,-50],[98,-52]],sk,e)}<g class="held">${o.held||''}</g></g></g></g>
 </g></g>`}
function lantern(id,x,y,s=1,on=true){return `<g id="${id}" transform="translate(${x} ${y}) scale(${s})"><circle class="lglow" r="120" fill="url(#warm)" opacity="${on?1:0}"/>

function crossInto(el,box,done){if(reduced||!box.animate){$('held').hidden=true;el.hidden=false;done();return}
 el.hidden=false;el.classList.add('crossing');
 const a=box.animate([{transform:'rotate(180deg) scale(.3)',clipPath:'circle(30% at 50% 50%)',offset:0},{transform:'rotate(180deg) scale(.3)',clipPath:'circle(30% at 50% 50%)',offset:.28},{transform:'rotate(0deg) scale(.34)',clipPath:'circle(30% at 50% 50%)',offset:.62},{transform:'none',clipPath:'circle(75% at 50% 50%)',offset:1}],{duration:2600,easing:'steps(18)'});
 a.onfinish=()=>{el.classList.remove('crossing');$('held').hidden=true;$('held').classList.remove('up');done()}}
// ---------- a room: the choice, the consequence, the threshold into its film ----------
let R=null;
function enterRoom(key,o={}){const st=ST[key];G.screen='story';$('note').textContent='';Snd.play('page');Snd.music(key==='help'?'dawn':'night');
 const story=$('story');story.classList.toggle('ghost',!!o.ghost);$('ghost-slate').hidden=!o.ghost;$('thought').textContent='';
 $('st-svg').innerHTML=st.build();$('desc').textContent=st.title+'. '+st.desc;story.setAttribute('aria-label',st.title);
 R={key,word:st.word,st,seq:st.intro.slice(),i:0,t:0,T:0,S:JSON.parse(JSON.stringify(st.state)),from:null,to:null,fired:new Set(),cap:null,choice:null,paused:false,hold:!!o.cross,noReveal:!!(o.cross||o.ghost),ghost:o.ghost};
 if(o.ghost){// Replay the setup silently, then play the way you didn't take.
  for(const b of st.intro){if(b.gate)break;R.S=blend(R.S,beatTo(st,b),1)}R.choice=o.ghost;R.seq=st[o.ghost].slice();announce('Another way. It doesn’t change what you did. '+st.title)}
 else announce(st.title+'. '+st.desc);
 if(o.cross){$('pause').hidden=true;$('story').hidden=false;R.st.render(R.S,0,0);crossInto($('story'),$('story').querySelector('.box'),()=>{only('story');R.hold=false;startBeat()})}
 else{only('story');startBeat()}}
function beatTo(st,b){const to=JSON.parse(JSON.stringify(b.to||{}));for(const [who,name] of Object.entries(b.pose||{})){to[who]=st.poses[who][name];to[who+'Pose']=name}return to}
function startBeat(){const b=R.seq[R.i];if(!b){if(R.ghost){const w=R.word;R=null;$('story').classList.remove('ghost');toMirror(w,true)}else finishRoom('stay');return}
 R.t=0;R.from=JSON.parse(JSON.stringify(R.S));R.to=beatTo(R.st,b);if(b.mark)R.S[b.mark]=R.T;
 if(b.note)announce(b.note);
 if(b.exit)G.frames[R.word]=snap();
 const ch=$('choices');ch.innerHTML='';$('thought').textContent='';
 if(b.gate){for(const c of b.choices){const btn=document.createElement('button');btn.className='choice';btn.innerHTML=`<span>${c.label}</span>`;btn.setAttribute('aria-label',c.label);btn.style.left=c.at[0]/16+'%';btn.style.top=c.at[1]/9+'%';btn.onclick=()=>b.exit?chooseExit(c.id):choose(c.id);ch.appendChild(btn)}
  if(b.peek&&!R.ghost)requestAnimationFrame(()=>addPeek(b.peek));
  setTimeout(()=>ch.querySelector('button')?.focus({preventScroll:true}),50);announce((b.exit?'Where next: ':'Your choice: ')+b.choices.map(c=>c.label).join(', or ')+(b.peek?'. Or look closer first.':''))}}
function addPeek(pk){const t=$(pk.target),box=$('story').querySelector('.box').getBoundingClientRect();if(!R)return;const r=t?t.getBoundingClientRect():{left:box.left+pk.at[0]/1600*box.width,top:box.top+pk.at[1]/900*box.height,width:0,height:0};
 const btn=document.createElement('button');btn.className='peek';btn.innerHTML=`<span>${pk.label}</span>`;btn.setAttribute('aria-label',pk.sr);
 btn.style.left=((r.left+r.width/2-box.left)/box.width*100)+'%';btn.style.top=((r.top+r.height/2-box.top)/box.height*100)+'%';
 btn.onclick=()=>{if(!R)return;G.peeked[R.key]=1;Object.assign(R.S,pk.show);R.force=1;$('thought').textContent=pk.thought;announce(pk.say);Snd.play('pencil');btn.remove();
  setTimeout(()=>{if(R&&!R.choice){for(const k of Object.keys(pk.show))R.S[k]=0;R.force=1;$('thought').textContent=''}},reduced?9000:7500)};
 $('choices').appendChild(btn)}
function choose(id){if(!R||R.choice)return;R.choice=id;$('choices').innerHTML='';$('thought').textContent='';for(const k of ['peek'])if(k in R.S)R.S[k]=0;Snd.play('pick');
 R.seq.push(...R.st[id]);const f=BOTTLES[R.word]?.film;
 const xa=R.st.exitAt||[[1210,690],[400,690]];if(f)R.seq.push({gate:1,exit:1,choices:[{id:'film',label:(R.st.exit&&R.st.exit[id])||`Go deeper: ${FILMS[f].title}`,at:xa[0]},{id:'stay',label:'Stay with the night',at:xa[1]}]});
 R.i++;startBeat()}
function chooseExit(id){if(!R)return;$('choices').innerHTML='';Snd.play('pick');finishRoom(id)}
function finishRoom(id){const w=R.word;G.done[R.key]=R.choice;if(!G.frames[w])G.frames[w]=snap();R=null;if(id==='film')startFilm(w,{fromRoom:true});else toMirror(w)}
function snap(){return $('st-svg').innerHTML.replace(/\sid="[^"]*"/g,'').replace(/\sfilter="[^"]*"/g,'').replace(/\sclass="[^"]*"/g,'')}
function blend(from,to,u){const o=Array.isArray(from)?[]:{};for(const k of Object.keys({...from,...to})){const a=from?.[k],b=to?.[k];if(b===undefined)o[k]=a;else if(typeof b==='number'&&typeof (a??0)==='number')o[k]=lerp(a??0,b,u);else if(Array.isArray(b))o[k]=b.map((v,i)=>lerp((a||b)[i],v,u));else if(typeof b==='object')o[k]=blend(a||{},b,u);else o[k]=b}return o}
function stepStory(dt){if(!R||R.paused||R.hold)return;const b=R.seq[R.i];if(!b)return;R.T+=dt;
 if(b.gate){R.st.render(R.S,Math.floor(R.T*FPS),R.T);return}
 R.t+=dt;const u=b.slow?qe(R.t/(b.dur*.85),16):qe(R.t/Math.min(b.dur,2.4),10);R.S=blend(R.from,R.to,u);
 for(const [t,who,text,id] of b.lines||[]){const k=R.i+':'+t;if(R.t>=t&&!R.fired.has(k)){R.fired.add(k);R.cap={who,text,until:R.T+Math.max(2.2,text.length*.06+1.2)};announce(who+': '+text);if(!R.ghost)Snd.voice(id)}}
 for(const [t,s] of b.sfx||[]){const k=R.i+':s'+t+s;if(R.t>=t&&!R.fired.has(k)){R.fired.add(k);Snd.play(s)}}
 if(R.cap&&R.T>R.cap.until)R.cap=null;
 // The room opens dark: your lantern finds it, then the light comes up. (Not after a crossing: the bottle already did that.)
 const rv=$('rvr');if(b.reveal&&!reduced&&!R.noReveal){const k=R.t<3.2?1:Math.max(0,1-(R.t-3.2)/1.2);rv.setAttribute('opacity',(Math.round(k*6)/6).toFixed(2))}else rv.setAttribute('opacity',0);
 if(R.t>=b.dur){R.i++;startBeat()}}
function renderStory(){if(!R)return;const f=Math.floor(R.T*FPS);if(f===R.lastF&&!R.force)return;R.lastF=f;R.force=0;R.st.render(R.S,f,R.T);
 const c=$('caption');c.style.visibility=R.cap?'visible':'hidden';if(R.cap){$('who').textContent=R.cap.who;$('line').textContent=R.cap.text}
 const [x,y]=boil('frame',f);$('st-svg').style.transform=`translate(${(x*.5).toFixed(2)}px,${(y*.5).toFixed(2)}px)`}
$('story').addEventListener('pointermove',e=>{const r=$('st-svg').getBoundingClientRect();at('rvc',{cx:(e.clientX-r.left)/r.width*1600,cy:(e.clientY-r.top)/r.height*900})});
// ---------- the film: the label's other side, played whole and unchanged ----------
let FILM=null;
function startFilm(w,o={}){const id=BOTTLES[w].film,f=FILMS[id],key=KEY[w],c=key&&G.done[key];G.screen='film';Snd.music(null);
 const scr=$('filmscr');scr.setAttribute('aria-label',f.title);
 const slate=$('slate');slate.hidden=false;slate.querySelector('b').textContent=key==='heard'&&o.fromRoom?'The next morning.':f.title;
 slate.querySelector('span').textContent=(key&&ST[key].slate&&c&&ST[key].slate[c])||f.arrival;
 $('film-back').hidden=true;scr.querySelector('iframe')?.remove();
 const fr=document.createElement('iframe');fr.title=f.title;fr.hidden=true;const session='unfolded-'+Date.now().toString(36);fr.src=ROOT+f.src+'?session='+session;scr.appendChild(fr);
 FILM={w,id,frame:fr,session,ready:false,slateDone:false};announce(slate.textContent);
 const afterSlate=()=>setTimeout(()=>{if(!FILM||FILM.frame!==fr)return;FILM.slateDone=true;slate.hidden=true;fr.hidden=false;tryStart()},reduced?1800:3200);
 if(o.cross){crossInto(scr,slate,()=>{only('filmscr');afterSlate()})}
 else{only('filmscr');if(!reduced&&slate.animate)slate.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:900,easing:'steps(8)'});Snd.play('page');afterSlate()}
 fr.addEventListener('load',()=>{if(FILM?.frame===fr&&fr.contentWindow?.__asterwindEpisode?.assetsReady){FILM.ready=true;tryStart()}})}
function tryStart(){if(!FILM||!FILM.ready||!FILM.slateDone||FILM.started)return;FILM.started=true;const win=FILM.frame.contentWindow;
 try{win.__asterwindEpisode?.start();setTimeout(()=>{try{(win.document.getElementById('pause')||FILM.frame).focus()}catch{FILM.frame.focus()}},120)}catch{FILM.frame.focus()}}
addEventListener('message',e=>{const d=e.data;if(!FILM||e.source!==FILM.frame.contentWindow||!d||d.channel!=='asterwind.episode.v1'||d.session!==FILM.session)return;
 if(d.type==='ready'){FILM.ready=true;tryStart()}
 if(d.type==='completed'){if(!G.film[FILM.w])G.film[FILM.w]=d.outcome;const b=$('film-back');b.hidden=false;setTimeout(()=>b.focus({preventScroll:true}),900);announce('The film has ended. Back into the night when you’re ready.')}});
function leaveFilm(){if(!FILM)return;const w=FILM.w,fr=FILM.frame;FILM=null;try{fr.src='about:blank'}catch{}fr.remove();if(!G.frames[w])G.frames[w]=null;toMirror(w)}
$('film-leave').onclick=leaveFilm;$('film-back').onclick=leaveFilm;
// ---------- the mirror: one question, what happened remembered, the other way open to look at ----------
function toMirror(w,afterGhost){const key=KEY[w],st=key?ST[key]:null;G.screen='mirror';only('mirror');const m=$('mirror');m.dataset.word=w;
 const c=key&&G.done[key];m.querySelector('.mem').textContent=(st&&st.memory&&c&&st.memory[c][G.film[w]||'none'])||'';
 m.querySelector('.q').textContent=st?st.question:LEADQ.question;m.querySelector('.trace').innerHTML=st?st.trace:LEADQ.trace;
 $('mirror-other').hidden=!(st&&c);$('mirror-other').textContent=afterGhost?'See it again':'See the other way';Snd.music(null);Snd.play('hush');
 setTimeout(()=>$(afterGhost?'mirror-go':'mirror-go').focus({preventScroll:true}),400)}
$('mirror-go').onclick=()=>{const w=$('mirror').dataset.word;if(!G.walked.includes(w))G.walked.push(w);Snd.play('clink');showCorridor()};
$('mirror-other').onclick=()=>{const w=$('mirror').dataset.word,key=KEY[w],st=ST[key];const other=Object.keys(st.notes).find(c=>c!==G.done[key]);enterRoom(key,{ghost:other})};
function writeNotes(){let n='';for(const w of TARGETS){const key=KEY[w],[x,y]=PLACE[w];let t='';if(key&&G.done[key])t=ST[key].notes[G.done[key]];else if(!key&&G.walked.includes(w))t={microphone:'moved the microphone',notebook:'showed the notebook'}[G.film[w]]||'heard whose map it was';if(t)n+=`<text x="${x}" y="${y+86}" text-anchor="middle">${t}</text>`;if(G.walked.includes(w))$('boat-'+w)?.classList.add('done')}const g=$('nb-notes');if(g)g.innerHTML=n}
function backToNotebook(){G.screen='notebook';only('notebook');writeNotes();updateGo();Snd.music(null);setTimeout(()=>($('tiles').querySelector('button'))?.focus({preventScroll:true}),100)}
// ---------- the ending: the word, rewritten by what you did ----------
function endWords(){const ws=TARGETS.filter(t=>G.found.includes(t)).map(t=>t.toLowerCase());const pos=[[300,370],[650,370],[300,440],[650,440],[300,510],[650,510]];
 $('nb-around').innerHTML=ws.map((w,i)=>`<text x="${pos[i][0]}" y="${pos[i][1]}" text-anchor="${i%2?'end':'start'}">${w}</text>`).join('')+'<text x="320" y="600" font-size="30">Leadership is…</text>'+(G.mine?`<text x="470" y="700" text-anchor="middle" font-size="40" fill="#26232e">${G.mine}</text>`:'');at('nb-q',{opacity:0})}
function beginEnding(){G.ending=1;G.screen='notebook';only('notebook');writeNotes();Snd.play('page');$('tiles').hidden=true;$('spell').hidden=true;$('note').textContent='';$('go').hidden=true;$('boats').hidden=true;
 G.ended=1;endWords();const mine=$('mine');mine.hidden=false;$('closebook').hidden=false;mine.focus({preventScroll:true});announce('Morning. Leadership is… Write your own word if you like. It stays on this screen only.')}
$('go').onclick=()=>showCorridor();
$('closebook').onclick=()=>{const v=$('mine').value.trim();if(v){G.mine=v.replace(/[<>&"]/g,'');endWords();Snd.play('pencil')}
 $('mine').hidden=true;$('closebook').hidden=true;setTimeout(()=>{only('end');G.screen='end';Snd.music(null);setTimeout(()=>$('again').focus({preventScroll:true}),300)},v?2200:600)};
$('again').onclick=()=>location.reload();
// ---------- sound: recorded paper when present (sound/manifest.json), music if switched on, voices by cue id ----------
const Snd=(()=>{let c=null,on=false,buf={},mus=null,musBuf={},vIdx=null,vSet=Q.get('voices')||null,vSrc=null;
 async function load(u){try{return await c.decodeAudioData(await(await fetch(u)).arrayBuffer())}catch{return null}}
 return{async enable(v){on=v;if(on&&!c){c=new AudioContext();try{const m=await(await fetch('sound/manifest.json')).json();for(const [k,f] of Object.entries(m.cues))load('sound/'+f.file).then(b=>b&&(buf[k]={b,g:f.gain??1}));for(const [k,f] of Object.entries(m.music||{}))load('sound/'+f).then(b=>b&&(musBuf[k]=b))}catch{}
   try{vIdx=await(await fetch('voices/index.json')).json()}catch{vIdx=null}this.voiceUI()}if(!on)this.music(null);$('voice').hidden=!on||!vIdx},
  play(k){if(!on||!c||!buf[k])return;const s=c.createBufferSource(),g=c.createGain();s.buffer=buf[k].b;g.gain.value=buf[k].g;s.connect(g);g.connect(c.destination);s.start()},
  music(k){if(mus){const m=mus;m.g.gain.setTargetAtTime(0,c.currentTime,.6);setTimeout(()=>m.s.stop(),2500);mus=null}if(!on||!c||!k||!musBuf[k])return;const s=c.createBufferSource(),g=c.createGain();s.buffer=musBuf[k];s.loop=true;g.gain.value=0;g.gain.setTargetAtTime(vSet?.16:.32,c.currentTime,1);s.connect(g);g.connect(c.destination);s.start();mus={s,g}},
  sets(){return vIdx?Object.keys(vIdx.sets).filter(k=>Object.keys(vIdx.sets[k].cues||{}).length):[]},
  cycle(){const s=this.sets(),i=s.indexOf(vSet);vSet=i+1<s.length?s[i+1]:null;this.voiceUI()},
  voiceUI(){const b=$('voice');b.textContent='Voices: '+(vSet&&vIdx?.sets[vSet]?vIdx.sets[vSet].label:'off');b.setAttribute('aria-pressed',String(!!vSet))},
  async voice(id){if(!on||!c||!vSet||!id||!vIdx?.sets[vSet])return;const set=vIdx.sets[vSet],f=set.cues[id];if(!f)return;const b=await load('voices/'+set.dir+'/'+f);if(!b)return;try{vSrc?.stop()}catch{}const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=set.gain??1;s.connect(g);g.connect(c.destination);s.start();vSrc=s}}})();
$('snd').onclick=()=>{const v=$('snd').getAttribute('aria-pressed')!=='true';$('snd').setAttribute('aria-pressed',String(v));Snd.enable(v);if(v&&(G.screen==='story'||G.screen==='corridor'))setTimeout(()=>Snd.music(R?.key==='help'?'dawn':'night'),400)};
$('voice').onclick=()=>Snd.cycle();
$('pause').onclick=()=>{if(!R)return;R.paused=!R.paused;$('pause').setAttribute('aria-pressed',String(R.paused));$('pause').textContent=R.paused?'Resume':'Pause'};
// ---------- loop ----------
const now=()=>performance.now()/1000;let last=0;
function loop(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;if(!EXPORT){stepStory(dt);renderStory();hints()}requestAnimationFrame(loop)}
function announce(t){$('live').textContent=t}
buildTiles();setLayout();setTimeout(()=>at('nb-word',{opacity:.16}),reduced?0:600);G.lastFind=now();updateGo();
// A first word, shown: the obvious one. Then the page lets you look for the rest.
const DEMO='lead. The obvious one. It’s in there too, but keep looking.';
if(!reduced&&!EXPORT){[0,1,2,3].forEach((i,k)=>setTimeout(()=>{if(!G.found.length){G.picked.push(i);renderTiles()}},900+k*260));setTimeout(()=>{if(G.found.length)return;$('note').textContent=DEMO;setTimeout(()=>{if(G.found.length)return;clear();$('note').textContent='There are other words inside this one.'},2400)},2100)}
else $('note').textContent='There are other words inside this one.';
requestAnimationFrame(loop);
// ---------- review hooks ----------
window.Game={find:w=>{G.picked=[...w].map(ch=>[...WORD].findIndex((c,j)=>c===ch&&!G.picked.includes(j)));check()},enter:k=>enterRoom(k),corridor:showCorridor,bottle:showBottle,turn,holdUp,choose,exit:chooseExit,
 state:()=>({screen:G.screen,found:G.found,done:G.done,film:G.film,walked:G.walked,beat:R?.i,choice:R?.choice,ghost:R?.ghost,gate:!!(R&&R.seq[R.i]?.gate),exitGate:!!(R&&R.seq[R.i]?.exit),filmReady:FILM?.ready,filmStarted:FILM?.started}),
 step(dt){stepStory(dt);if(R)R.force=1;renderStory()},seek(t){while(R&&R.T<t&&R.seq[R.i]&&!R.seq[R.i].gate)this.step(1/24)},toGate(){while(R&&R.seq[R.i]&&!R.seq[R.i].gate&&!R.hold)this.step(1/12)},leaveFilm,dawn,art:()=>ARTIDX,room:()=>R,poses:()=>POSES};
