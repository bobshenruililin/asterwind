<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The Quiet Minute, played</title>
<!-- Style audition A/B: the film's own painted plates, made playable and alive (depth parallax, puppet warps,
     a platter you turn, a tray you slide, a practical lamp). Lines are the film's (anthology/episodes/standup).
     No network, no dependencies. -->
<style>
@font-face{font-family:Kalam;src:url('../../../app/assets/fonts/Kalam-Regular.ttf') format('truetype');font-display:swap}
:root{--ink:#f3e7cf;--gold:#e9c27a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%;background:#07070a;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#frame{position:fixed;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#000;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.obj{position:absolute;border:0;background:none;padding:0;border-radius:50%;outline:none}
.obj.rect{border-radius:10px}
.obj:focus-visible{box-shadow:0 0 0 2px #e9c27acc}
.obj[hidden]{display:none}
#word{position:absolute;pointer-events:none;font:clamp(16px,2.2vw,30px) Kalam,cursive;color:#ffe8b8;text-shadow:0 2px 10px #000,0 0 3px #000;opacity:0;transition:opacity .25s;transform:translate(-50%,-50%)}
#cap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(860px,84%);margin:0;text-align:center;font-size:clamp(16px,2.1vw,28px);line-height:1.35;text-shadow:0 2px 8px #000,0 0 3px #000;pointer-events:none;min-height:1.4em}
#cap .who{display:block;font:11px system-ui;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
#cap.narr{font-style:italic;color:#e6dccb}
#thought.close{left:27%;right:auto;top:3.5%;width:46%;text-align:center}
#thought{position:absolute;right:6%;top:9%;width:30%;margin:0;font:clamp(15px,1.9vw,25px)/1.35 Kalam,cursive;color:#fff1d6;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,#0000,#000c);border:0;width:100%;z-index:3}
#start span{font:clamp(18px,2.4vw,30px) Georgia,serif;letter-spacing:.06em;padding:.6em 1.4em;border:1px solid #e9c27a99;background:#0b0b10aa}
#start:focus-visible span{outline:2px solid var(--gold);outline-offset:4px}
#chrome{position:absolute;right:1.2%;top:1.6%;display:flex;gap:6px;z-index:4;opacity:.5}#chrome:hover,#chrome:focus-within{opacity:1}
#chrome button{background:#0b0b12aa;border:1px solid #ffffff22;border-radius:16px;height:32px;padding:0 10px;font:12px system-ui}
#chrome button[aria-pressed=true]{color:var(--gold);border-color:#e9c27a88}
#end{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
#end button{background:#0b0b12cc;border:1px solid #e9c27a99;border-radius:2px;padding:.5em 1.2em;font:clamp(13px,1.4vw,17px) system-ui}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){#word,#thought{transition:none}}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div id="screen">
<div id="frame" aria-label="The Quiet Minute, played. A committee table at night: Theo, Nia and Ellis plan a night walk around a paper model of the campus.">
 <canvas id="cv" aria-hidden="true"></canvas>
 <button class="obj" id="platter" hidden aria-label="Turn the table: one concern each, before replies."></button>
 <button class="obj rect" id="tray" hidden aria-label="Pass the slips: collect each concern, then discuss."></button>
 <button class="obj rect" id="route" hidden aria-label="Look at Ellis's folded route (optional)."></button>
 <div id="word" aria-hidden="true"></div>
 <button id="start" disabled><span>Loading scene…</span></button>
</div>
 <p id="thought" hidden aria-hidden="true"></p>
 <p id="cap" aria-hidden="true"><span class="who"></span><span class="line"></span></p>
 <div id="end" hidden><button id="again">Again</button><button id="other">The other way</button></div>
 <div id="chrome"><button id="snd" aria-pressed="true" aria-label="Sound">♪</button><button id="cc" aria-pressed="true">Captions</button><button id="pause" aria-pressed="false">Pause</button></div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script src="support.js"></script>
<script src="stage.js"></script>
<script src="clips.js"></script>
<script src="quiet.js"></script>
</body>
</html>
