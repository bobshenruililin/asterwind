de\"><\/div>\n\n<div id=\"actions\" hidden><p id=\"prompt\">How will you open with Asha’s work?<\/p><button id=\"microphone\" aria-label=\"Move the microphone. Asha opens with her fieldwork, as she has offered.\"><span>Move the microphone<\/span><\/button><button id=\"notebook\" aria-label=\"Show the notebook. Credit Asha’s fieldwork yourself and keep the planned pitch.\"><span>Show the notebook<\/span><\/button><\/div>\n<div id=\"caption\" aria-live=\"off\"><strong id=\"speaker\"><\/strong><span id=\"line\"><\/span><\/div>\n<button id=\"start\">The Missing Name <span>Enter the showcase<\/span><\/button>\n<nav aria-label=\"Film controls\"><button id=\"pause\" hidden aria-label=\"Pause story\">Pause<\/button><button id=\"replay\" hidden>Replay<\/button><\/nav>\n<p id=\"ending\" hidden role=\"status\"><\/p>\n<div id=\"announcement\" class=\"sr\" aria-live=\"polite\"><\/div>\n<\/main><script>window.NAME_STORY={\"id\": \"slides\", \"title\": \"The Missing Name\", \"origin\": \"Original fiction about attribution and agency. Not a Q5 adaptation and not an allegation about real teammates.\", \"setup\": [{\"stage\": \"open\", \"shot\": \"wide\", \"duration\": 5000, \"speaker\": \"\", \"line\": \"A route diagram fills the screen at the research showcase.\"}, {\"stage\": \"source\", \"shot\": \"hands\", \"duration\": 4500, \"speaker\": \"\", \"line\": \"The same pencilled route runs through Asha’s field notebook.\"}, {\"stage\": \"kit\", \"shot\": \"kit\", \"duration\": 3500, \"speaker\": \"Kit\", \"line\": \"That opening looks incredible.\"}, {\"stage\": \"asha\", \"shot\": \"asha\", \"duration\": 5000, \"speaker\": \"Asha\", \"line\": \"They won’t know where the map came from.\"}, {\"stage\": \"repair\", \"shot\": \"lead\", \"duration\": 4000, \"speaker\": \"You\", \"line\": \"We correct that before we start.\"}, {\"stage\": \"limit\", \"shot\": \"asha\", \"duration\": 5000, \"speaker\": \"Asha\", \"line\": \"I can explain the fieldwork. But not the whole pitch.\"}, {\"stage\": \"tradeoff\", \"shot\": \"kit\", \"duration\": 6000, \"speaker\": \"Kit\", \"line\": \"If we change the opening, we’ll have less time for the final model.\"}, {\"stage\": \"choice\", \"shot\": \"wide\", \"duration\": 9000, \"speaker\": \"Asha\", \"line\": \"Either introduce my work yourself, or let me open with the map. I’m happy with both.\"}], \"choice\": {\"prompt\": \"How will you open with Asha’s work?\", \"actions\": [{\"id\": \"microphone\", \"label\": \"Move the microphone\", \"description\": \"Asha opens with her fieldwork, as she has offered.\"}, {\"id\": \"notebook\", \"label\": \"Show the notebook\", \"description\": \"Credit Asha’s fieldwork yourself, keeping the planned pitch.\"}]}, \"branches\": {\"microphone\": [{\"stage\": \"introduce\", \"shot\": \"wide\", \"duration\": 6000, \"speaker\": \"You\", \"line\": \"Asha will open with the fieldwork that shaped this map.\"}, {\"stage\": \"offer\", \"shot\": \"hands\", \"duration\": 5000, \"speaker\": \"\", \"line\": \"You slide the microphone toward Asha. She takes it and turns toward her notebook.\"}, {\"stage\": \"authorship\", \"shot\": \"asha\", \"duration\": 7000, \"speaker\": \"Asha\", \"line\": \"This line moved three times. People showed us why.\"}, {\"stage\": \"context\", \"shot\": \"hands\", \"duration\": 6500, \"speaker\": \"\", \"line\": \"Her finger follows the route through her notebook. She explains why it changed. The audience leans closer.\"}, {\"stage\": \"follow\", \"shot\": \"kit\", \"duration\": 5000, \"speaker\": \"Kit\", \"line\": \"And that is why our model starts with the people who use it.\"}, {\"stage\": \"ending-microphone\", \"shot\": \"wide\", \"duration\": 7000, \"speaker\": \"\", \"line\": \"The slot ends before the decorative model reveal. Asha and Kit share the projection; the model stays inside its closed box.\"}], \"notebook\": [{\"stage\": \"credit\", \"shot\": \"hands\", \"duration\": 10500, \"speaker\": \"You\", \"line\": \"Asha built this map through the fieldwork. These are her observations, not details we invented for the model.\"}, {\"stage\": \"reveal\", \"shot\": \"wide\", \"duration\": 4500, \"speaker\": \"\", \"line\": \"Kit continues the planned pitch. The full model opens beside Asha’s original notebook.\"}, {\"stage\": \"question\", \"shot\": \"kit\", \"duration\": 4000, \"speaker\": \"Visitor\", \"line\": \"What made you change that route?\"}, {\"stage\": \"invite\", \"shot\": \"kit\", \"duration\": 4500, \"speaker\": \"Kit\", \"line\": \"Asha, would you like to answer that?\"}, {\"stage\": \"accept\", \"shot\": \"asha\", \"duration\": 6500, \"speaker\": \"Asha\", \"line\": \"Yes. That route changed after our second visit.\"}, {\"stage\": \"ending-notebook\", \"shot\": \"wide\", \"duration\": 6000, \"speaker\": \"\", \"line\": \"The full model is visible. So is the field notebook. The opening was framed for Asha; this answer is hers.\"}]}};<\/script><script>window.NAME_ART={\"schemaVersion\": 1, \"plates\": {\"master\": {\"src\": \"assets/80652cb28d6dcdff03eef24bd1dcadcbb864cc4e.webp\", \"alt\": \"Asha, wearing teal, shows her field notebook. Kit in rust and the lead in indigo stand beside the matching projected map. A closed model box sits between them.\", \"width\": 1672, \"height\": 941}, \"decision\": {\"src\": \"assets/46c0bc249fa7302debd21edc65afe49efbfe2deb.webp\", \"alt\": \"A microphone rests left; Asha’s open notebook stands right. She gestures willingly toward the two ways to introduce her work.\", \"width\": 1672, \"height\": 941}, \"microphone\": {\"src\": \"assets/de555a2b3a7e5fb685f8ea34fa11b52d429a11ce.webp\", \"alt\": \"Asha holds the microphone and explains her field map. Kit and the lead listen; the decorative model remains in its closed box.\", \"width\": 1671, \"height\": 941}, \"notebook\": {\"src\": \"assets/b4169d6fc81101ca61f0c8e8e518ed14df0deb3c.webp\", \"alt\": \"The full neighbourhood model is revealed. Kit invites Asha to answer an audience question; she speaks beside her visible o onnect the panel. Give Jo independent control through a smaller duplicate panel.\"><span>Connect the panel<\/span><\/button><\/div>\n<div id=\"caption\" aria-live=\"off\"><strong id=\"speaker\"><\/strong><span id=\"line\"><\/span><\/div>\n<button id=\"start\">The Empty Square <span>Enter the exhibition<\/span><\/button>\n<nav aria-label=\"Film controls\"><button id=\"pause\" hidden aria-label=\"Pause story\">Pause<\/button><button id=\"replay\" hidden>Replay<\/button><\/nav>\n<p id=\"ending\" hidden role=\"status\"><\/p>\n<div id=\"announcement\" class=\"sr\" aria-live=\"polite\"><\/div>\n<\/main><script>window.SQUARE_STORY={\"id\": \"pixel\", \"title\": \"The Empty Square\", \"origin\": \"Original fictional inclusive-design story; Q8-inspired structural inclusion, not a direct adaptation. Lived-experience accessibility review still required.\", \"setup\": [{\"stage\": \"open\", \"shot\": \"wide\", \"duration\": 7500, \"speaker\": \"\", \"line\": \"Jo, a visiting student designer, finds an exhibition’s controls mounted high. The paper world waits for its next sequence.\"}, {\"stage\": \"jo\", \"shot\": \"jo\", \"duration\": 5000, \"speaker\": \"Jo\", \"line\": \"I want to choose the sequence myself.\"}, {\"stage\": \"options\", \"shot\": \"hands\", \"duration\": 5500, \"speaker\": \"Remy\", \"line\": \"We can bring the controls down. Or connect this second panel.\"}, {\"stage\": \"cost\", \"shot\": \"remy\", \"duration\": 7500, \"speaker\": \"Remy\", \"line\": \"Lowering the adjustable console means stopping and rebalancing it. This panel connects now, but its switches are smaller.\"}, {\"stage\": \"agency\", \"shot\": \"jo\", \"duration\": 6500, \"speaker\": \"Jo\", \"line\": \"Either lets me operate it. I’d rather not have someone choose the sequence for me.\"}, {\"stage\": \"difference\", \"shot\": \"hands\", \"duration\": 5500, \"speaker\": \"\", \"line\": \"The large controls have a long, tactile travel. The portable panel has shorter, smaller switches.\"}, {\"stage\": \"choice\", \"shot\": \"wide\", \"duration\": 5500, \"speaker\": \"Jo\", \"line\": \"Let’s try either. I’ll tell you what works for me.\"}], \"choice\": {\"prompt\": \"Which controls will you put within reach?\", \"actions\": [{\"id\": \"lower\", \"label\": \"Lower the console\", \"description\": \"Pause and lower the adjustable console so Jo can use its large controls.\"}, {\"id\": \"connect\", \"label\": \"Connect the panel\", \"description\": \"Connect the smaller duplicate panel so Jo can operate the same display now.\"}]}, \"branches\": {\"lower\": [{\"stage\": \"pause\", \"shot\": \"hands\", \"duration\": 6000, \"speaker\": \"\", \"line\": \"You release the catches with Remy. The display pauses while the supported console is adjusted on its rails.\"}, {\"stage\": \"height\", \"shot\": \"jo\", \"duration\": 5000, \"speaker\": \"\", \"line\": \"Jo indicates a comfortable height. Remy secures the catches before the display restarts.\"}, {\"stage\": \"works\", \"shot\": \"jo\", \"duration\": 5000, \"speaker\": \"Jo\", \"line\": \"There. That works for me.\"}, {\"stage\": \"operate\", \"shot\": \"hands\", \"duration\": 6000, \"speaker\": \"\", \"line\": \"Jo chooses the sequence herself. The paper train advances. The large controls have the same long travel.\"}, {\"stage\": \"ending-lower\", \"shot\": \"wide\", \"duration\": 7500, \"speaker\": \"\", \"line\": \"Some visitors left during the pause. The controls are now shared at the height Jo chose.\"}], \"connect\": [{\"stage\": \"plug\", \"shot\": \"hands\", \"duration\": 5500, \"speaker\": \"\", \"line\": \"You connect the duplicate panel. Jo chooses a sequence herself. The same paper world responds.\"}, {\"stage\": \"feedback\", \"shot\": \"jo\", \"duration\": 6500, \"speaker\": \"Jo\", \"line\": \"It works. These switches don’t feel like the big ones.\"}, {\"stage\": \"request\", \"shot\": \"lead\", \"duration\": 6000, \"speaker\": \"You\", \"line\": \"Would you help us test a better version after this "/><path d=\"M782 475v75m26-75v75m-26-65h26\" stroke=\"#786954\" stroke-width=\"9\"/><\/g><g id=\"token\"><circle cx=\"575\" cy=\"600\" r=\"25\" fill=\"#dbb45e\"/><circle cx=\"575\" cy=\"600\" r=\"13\" stroke=\"#725d48\" stroke-width=\"3\" fill=\"none\"/><\/g><g id=\"tray\"><path fill=\"#9b725f\" d=\"m1060 620 210-15 40 95-230 20z\"/><path fill=\"#eadbb8\" d=\"m1080 625 160-10 30 55-170 15z\"/><path fill=\"#eee1c8\" d=\"m1100 650 125-20 20 38-120 23z\"/><\/g><g id=\"sketch\"><path fill=\"#e9d9b8\" d=\"m410 440 100-35 30 85-110 37z\"/><path d=\"m450 448 12 35m14-42 13 32m-39-17 33-13\" stroke=\"#7d705d\" stroke-width=\"5\"/><\/g><\/g><\/svg><\/div>\n<div id=\"shade\"><\/div>\n\n<div id=\"actions\" hidden><p id=\"prompt\">How will you hear the room?<\/p><button id=\"round\" aria-label=\"Turn the table. Hear one concern from each person before replies.\"><span>Turn the table<\/span><\/button><button id=\"slips\" aria-label=\"Pass the slips. Collect each concern before discussing it.\"><span>Pass the slips<\/span><\/button><\/div>\n<div id=\"caption\" aria-live=\"off\"><strong id=\"speaker\"><\/strong><span id=\"line\"><\/span><\/div>\n<button id=\"start\">The Quiet Minute <span>Enter the committee room<\/span><\/button>\n<nav aria-label=\"Film controls\"><button id=\"pause\" hidden aria-label=\"Pause story\">Pause<\/button><button id=\"replay\" hidden>Replay<\/button><\/nav>\n<p id=\"ending\" hidden role=\"status\"><\/p>\n<div id=\"announcement\" class=\"sr\" aria-live=\"polite\"><\/div>\n<\/main><script>window.QUIET_STORY={\"id\": \"standup\", \"title\": \"The Quiet Minute\", \"origin\": \"Original fiction, thematically linked to workbook Q8, not a verbatim adaptation.\", \"setup\": [{\"shot\": \"wide\", \"duration\": 7000, \"speaker\": \"\", \"line\": \"The next room booking is soon. Theo keeps one hand on the night-walk plan.\", \"stage\": \"open\"}, {\"shot\": \"theo\", \"duration\": 6500, \"speaker\": \"Theo\", \"line\": \"Main gate, courtyard, then the harbour. Everyone happy?\", \"stage\": \"theo\"}, {\"shot\": \"nia\", \"duration\": 4500, \"speaker\": \"Nia\", \"line\": \"The courtyard gate closes—\", \"stage\": \"nia\"}, {\"shot\": \"theo\", \"duration\": 4000, \"speaker\": \"Theo\", \"line\": \"We’ll be through by then.\", \"stage\": \"interrupt\"}, {\"shot\": \"nia\", \"duration\": 5000, \"speaker\": \"Nia\", \"line\": \"We arrive after it closes.\", \"stage\": \"evidence\"}, {\"shot\": \"ellis\", \"duration\": 4500, \"speaker\": \"\", \"line\": \"Ellis lowers a pencil. Another route stays folded.\", \"stage\": \"ellis\"}, {\"shot\": \"lead\", \"duration\": 5500, \"speaker\": \"You\", \"line\": \"We haven’t heard the whole route yet.\", \"stage\": \"choice\"}], \"choice\": {\"prompt\": \"How will you hear the room?\", \"actions\": [{\"id\": \"round\", \"label\": \"Turn the table\", \"description\": \"One concern each, before replies.\"}, {\"id\": \"slips\", \"label\": \"Pass the slips\", \"description\": \"Collect each concern, then discuss.\"}]}, \"branches\": {\"round\": [{\"shot\": \"wide\", \"duration\": 6500, \"speaker\": \"You\", \"line\": \"One concern each. No replies until we’ve gone around.\", \"stage\": \"round\"}, {\"shot\": \"nia\", \"duration\": 5000, \"speaker\": \"Nia\", \"line\": \"The gate will be shut. We need to reach the courtyard first.\", \"stage\": \"listen\"}, {\"shot\": \"theo\", \"duration\": 4000, \"speaker\": \"\", \"line\": \"Theo starts to answer, then leaves the speaking token with Nia.\", \"stage\": \"wait\"}, {\"shot\": \"ellis\", \"duration\": 6500, \"speaker\": \"Ellis\", \"line\": \"Mine starts here. But we’d lose the harbour.\", \"stage\": \"alternative\"}, {\"shot\": \"wide\", \"duration\": 6500, \"speaker\": \"\", \"line\": \"The next group knocks. The harbour is still unfinished. Every seat now faces part of the route.\", \"stage\": \"ending-round\"}], \"slips\": [{\"shot\": \"wide\", \"duration\": 6500, \"speaker\": \"You\", \"line\": \"Put down the concern you haven’t said. Then we’ll sort them together.\", \"stage\": \"slips\"}, {\"shot\": \"hands\", \"duration\": 4000, \"speaker\": \"\", \"line\": \"Gate closure. Crowding. A different start. Theo adds a sketch too.\", \"stage\": \"collect\"}, {\"shot\": \"lead\", \"duration\": 3500, \"speaker\": \"You\", \"line\": \"Then we leave the courtyard out?\", \"stage\": \"misread\"}, {\"shot\": \"nia\", \"duration\": 5000, \"speaker\": \"Nia\", \"line\": \"Not cancel the courtyard. Go there first.\", \"stage\": \"correct\"}, {\"shot\": \"lead\", \"duration\": 4000, \"speaker\": \"You\", \"line\": \"Thank you. I read that too quickly.\", \"stage\": \"acknowledge\"}, {\"shot\": \"wide\", \"duration\": 5500, \"speaker\": \"\", \"line\": \"Nia points to the courtyard. The route almost fits. One slip remains unclear.\", \"stage\": \"ending-slips\"}]}};<\/script><script>window.QUIET_ART={\"schemaVersion\": 1, \"plates\": {\"master\": {\"src\": \"assets/8e4c080a3f8f32ec73ae9acf1998c9db074c8d49.webp\", \"alt\": \"Theo holds the rim of the campus model while Nia and Ellis hold unshared route sketches.\", \"width\": 1672, \"height\": 941}, \"decision\": {\"src\": \"assets/9f89f2c6a277eeb99b8a52218862fd1fc4d64f06.webp\", \"alt\": \"The campus model and speaking token are on the left; a tray of blank slips is on the right, within reach.\", \"width\": 1672, \"height\": 941}, \"round\": {\"src\": \"assets/4e4b9a9606856446412a914470069fdd77d13b6b.webp\", \"alt\": \"Nia and Ellis rebuild the route together. Harbour pieces remain outside the model. Theo listens.\", \"width\": 1672, \"height\": 941}, \"slips\": {\"src\": \"assets/b7488cae16bf72b4e2b22d039395281e7c6f73d1.webp\", \"alt\": \"Contributions surround the model. Nia clarifies her meaning while one slip remains unresolved.\", \"width\": 1672, \"height\": 941}}, \"beats\": {\"open\": {\"plate\": \"master\", \"focus\": 50, \"zoom\": 1, \"x\": 50, \"y\": 50}, \"theo\": {\"plate\": \"master\", \"focus\": 50, \"zoom\": 1.22, \"x\": 50, \"y\": 28}, \"nia\": .phase!=='ended';\n if(s.phase==='idle'){$('speaker').textContent=$('line').textContent='';$('stage').dataset.shot='wide';$('stage').dataset.beat='open';showArt('open');return}\n if(s.phase==='choice'){$('speaker').textContent='';$('line').textContent='';$('stage').dataset.shot='wide';$('stage').dataset.beat='choice';showArt('choice');layoutChoice();$('announcement').textContent='Choose one action: turn the table, or pass the slips. Take your time.';$('round').focus();return}\n if(s.phase==='ended'){$('ending').textContent='The Quiet Minute · End';$('replay').focus();if(!sent){sent=true;notify('completed',s.choice)}return}\n $('stage').dataset.shot=s.shot.shot;$('stage').dataset.beat=s.shot.stage;showArt(s.shot.stage);$('speaker').textContent=s.shot.speaker;$('line').textContent=s.shot.line;$('announcement').textContent=(s.shot.speaker?s.shot.speaker+': ':'')+s.shot.line;\n});\nfunction start(){if(!assetsReady){pendingStart=true;return false}return film.start()}\n$('start').onclick=()=>{start();$('pause').focus()};$('pause').onclick=()=>film.pause();$('round').onclick=()=>{if(film.choose('round'))$('pause').focus()};$('slips').onclick=()=>{if(film.choose('slips'))$('pause').focus()};$('replay').onclick=()=>{sent=false;film.restart();start();$('pause').focus()};\nfunction tick(now){if(stopped)return;const delta=Math.min(now-last,250);last=now;if(!document.hidden)film.advance(delta);requestAnimationFrame(tick)}requestAnimationFrame(tick);\nwindow.addEventListener('resize',layoutChoice);window.addEventListener('pagehide',()=>{stopped=true});\nwindow.__asterwindEpisode={id:'standup',version:1,start,get assetsReady(){return assetsReady},get state(){return film.state()}};\n$('start').disabled=true;$('start').querySelector('span').textContent='Preparing the paper scene…';\nconst timeout=new Promise(resolve=>setTimeout(()=>resolve(false),8000));\nconst preload=Promise.all(Object.entries(art?.plates||{}).map(([id,plate])=>new Promise(resolve=>{const img=new Image();img.onloa
